<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اهدایی فیلترشکن کاوه</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
    body{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#1e1e2f 0%,#2d2d44 100%);padding:20px}
    .main-title{color:#fff;font-size:26px;font-weight:700;margin-bottom:18px;text-align:center;letter-spacing:1px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 2px 20px rgba(102,126,234,.3);padding:0 10px;animation:titleGlow 3s ease-in-out infinite alternate}
    @keyframes titleGlow{from{filter:brightness(1)}to{filter:brightness(1.3)}}
    .main-title a{text-decoration:none;color:inherit;-webkit-text-fill-color:transparent;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background-clip:text;background-clip:text;display:inline-block;transition:transform .2s}
    .main-title a:hover{transform:scale(1.05)}
    .calculator{background:#2b2b3c;border-radius:24px;padding:24px;box-shadow:0 25px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);width:100%;max-width:420px;border:1px solid rgba(255,255,255,.05)}
    .display-wrapper{background:#1a1a26;border-radius:16px;padding:16px 20px;margin-bottom:20px;border:1px solid rgba(255,255,255,.05);box-shadow:inset 0 4px 12px rgba(0,0,0,.4);direction:ltr;text-align:right}
    .history{font-size:14px;color:#8a8aa0;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;letter-spacing:.5px}
    .display{font-size:42px;font-weight:300;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:1px;min-height:54px;line-height:54px;transition:font-size .15s ease}
    .display.small{font-size:28px}
    .display.tiny{font-size:20px}
    .memory-indicator{font-size:11px;color:#6c6c85;margin-bottom:8px;display:flex;justify-content:space-between;direction:ltr}
    .memory-indicator span{color:#ffb74d;opacity:0;transition:opacity .2s}
    .memory-indicator span.active{opacity:1}
    .keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    button{border:none;outline:none;cursor:pointer;border-radius:12px;font-size:18px;font-weight:500;padding:16px 4px;color:#fff;background:#3a3a4f;transition:all .12s ease;user-select:none;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
    button:hover{background:#46465e;transform:translateY(-1px)}
    button:active{transform:translateY(1px) scale(.98);filter:brightness(.9)}
    button.operator{background:#3f4a6b;color:#8ab4ff}
    button.operator:hover{background:#4a5680}
    button.function{background:#35354a;color:#b0b0c8;font-size:15px}
    button.function:hover{background:#404058}
    button.equals{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-size:24px;font-weight:600;box-shadow:0 6px 20px rgba(102,126,234,.4)}
    button.equals:hover{box-shadow:0 8px 26px rgba(102,126,234,.55);transform:translateY(-2px)}
    button.clear{background:#8b3a3a;color:#ffcdd2}
    button.clear:hover{background:#a04545}
    button.memory{background:#3a3a2f;color:#ffb74d;font-size:15px}
    button.memory:hover{background:#4a4a3a}
    button.num{background:#3a3a4f}
    .tabs{display:flex;gap:8px;margin-bottom:14px;background:#1f1f2e;padding:5px;border-radius:12px}
    .tab-btn{flex:1;padding:9px 6px;border-radius:9px;background:transparent;color:#7a7a95;font-size:13px;font-weight:600;transition:all .2s;box-shadow:none}
    .tab-btn:hover{background:rgba(255,255,255,.04);transform:none}
    .tab-btn.active{background:#3a3a4f;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .panel{display:none}
    .panel.active{display:block}
    .scientific-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
    .scientific-grid button{padding:11px 3px;font-size:13px;background:#303044;color:#a8a8c0}
    .scientific-grid button:hover{background:#3b3b55}
    @media (max-width:420px){
        .main-title{font-size:20px;margin-bottom:12px}
        .calculator{padding:16px;border-radius:18px}
        .display{font-size:34px;min-height:46px;line-height:46px}
        button{padding:14px 2px;font-size:16px}
        .scientific-grid button{padding:9px 2px;font-size:11px}
        .keypad{gap:8px}
    }
</style>
</head>
<body>

<h1 class="main-title"><a href="https://t.me/vpnv2rayshadowrocket" target="_blank" rel="noopener noreferrer">اهدایی فیلترشکن کاوه</a></h1>

<div class="calculator">
    <div class="display-wrapper">
        <div class="memory-indicator">
            <span id="memIndicator">M</span>
            <span id="angleIndicator">DEG</span>
        </div>
        <div class="history" id="history">&nbsp;</div>
        <div class="display" id="display">0</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="standard">استاندارد</button>
        <button class="tab-btn" data-tab="scientific">علمی</button>
    </div>

    <div class="panel active" id="panel-standard">
        <div class="keypad">
            <button class="memory" data-action="mc">MC</button>
            <button class="memory" data-action="mr">MR</button>
            <button class="memory" data-action="mplus">M+</button>
            <button class="memory" data-action="mminus">M−</button>
            <button class="memory" data-action="ms">MS</button>
            <button class="function" data-action="clear">C</button>
            <button class="function" data-action="backspace">⌫</button>

            <button class="num" data-num="6">6</button>
            <button class="operator" data-action="subtract">−</button>
            <button class="function" data-action="reciprocal">1/x</button>
            <button class="num" data-num="1">1</button>
            <button class="num" data-num="2">2</button>
            <button class="num" data-num="3">3</button>
            <button class="operator" data-action="add">+</button>
            <button class="function" data-action="negate">±</button>
            <button class="num" data-num="0">0</button>
            <button class="num" data-num=".">.</button>
            <button class="function" data-action="exp">e</button>
            <button class="equals" data-action="equals" style="grid-column: span 2;">=</button>
        </div>
    </div>

    <div class="panel" id="panel-scientific">
        <div class="scientific-grid">
            <button data-sci="sin">sin</button>
            <button data-sci="cos">cos</button>
            <button data-sci="tan">tan</button>
            <button data-sci="log">log</button>
            <button data-sci="ln">ln</button>
            <button data-sci="asin">sin⁻¹</button>
            <button data-sci="acos">cos⁻¹</button>
            <button data-sci="atan">tan⁻¹</button>
            <button data-sci="pow">xʸ</button>
            <button data-sci="root">ʸ√x</button>
            <button data-sci="fact">n!</button>
            <button data-sci="pi">π</button>
            <button data-sci="e">e</button>
            <button data-sci="abs">|x|</button>
            <button data-sci="exp10">10ˣ</button>
            <button data-sci="angle">DEG</button>
            <button data-sci="round">round</button>
            <button data-sci="floor">⌊x⌋</button>
            <button data-sci="ceil">⌈x⌉</button>
            <button data-sci="rand">Rnd</button>
        </div>

        <div class="keypad">
            <button class="memory" data-action="mc">MC</button>
            <button class="memory" data-action="mr">MR</button>
            <button class="memory" data-action="mplus">M+</button>
            <button class="memory" data-action="mminus">M−</button>
            <button class="memory" data-action="ms">MS</button>
            <button class="function" data-action="clear">C</button>
            <button class="function" data-action="backspace">⌫</button>
            <button class="function" data-action="percent">%</button>
            <button class="operator" data-action="divide">÷</button>
            <button class="function" data-action="sqrt">√</button>
            <button class="num" data-num="7">7</button>
            <button class="num" data-num="8">8</button>
            <button class="num" data-num="9">9</button>
            <button class="operator" data-action="multiply">×</button>
            <button class="function" data-action="power">x²</button>
            <button class="num" data-num="4">4</button>
            <button class="num" data-num="5">5</button>
            <button class="num" data-num="6">6</button>
            <button class="operator" data-action="subtract">−</button>
            <button class="function" data-action="reciprocal">1/x</button>
            <button class="num" data-num="1">1</button>
            <button class="num" data-num="2">2</button>
            <button class="num" data-num="3">3</button>
            <button class="operator" data-action="add">+</button>
            <button class="function" data-action="negate">±</button>
            <button class="num" data-num="0">0</button>
            <button class="num" data-num=".">.</button>
            <button class="function" data-action="exp">e</button>
            <button class="equals" data-action="equals" style="grid-column: span 2;">=</button>
        </div>
    </div>
</div>

<script>
(function(){
'use strict';
var _0x1a2b=['\x30','\x31','\x32','\x33','\x34','\x35','\x36','\x37','\x38','\x39'];
// ===== مبهم‌سازی: کد اصلی به صورت رشته‌های رمزگذاری‌شده و با نام‌های تصادفی =====
var _r=function(s){return s.replace(/[a-zA-Z]/g,function(c){var b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+13)%26+b)})};
var _d=function(s){return _r(_r(s))};
var _x=function(s){var o='';for(var i=0;i<s.length;i++){o+=String.fromCharCode(s.charCodeAt(i)^0x5A)}return o};

// state
var _s0='0',_s1=null,_s2=null,_s3=false,_s4=0,_s5='DEG';

var _e=function(id){return document.getElementById(id)};
var _q=function(sel){return document.querySelectorAll(sel)};

var _disp=_e('display'),_hist=_e('history'),_mem=_e('memIndicator'),_ang=_e('angleIndicator');
var _tabs=_q('.tab-btn'),_panels=_q('.panel');

function _toRad(d){return d*Math.PI/180}
function _fromRad(r){return _s5==='DEG'?r*180/Math.PI:r}

function _fmt(n){
    if(!isFinite(n))return 'خطا';
    if(isNaN(n))return 'خطا';
    var str=String(n);
    if(str.length>16){
        if(Math.abs(n)>=1e15||(Math.abs(n)<1e-9&&n!==0)){
            return n.toExponential(8).replace(/\.?0+e/,'e');
        }
        return String(parseFloat(n.toPrecision(14)));
    }
    return str;
}

function _upd(){
    var t=_s0;
    if(!isNaN(parseFloat(t))&&t!=='خطا'&&!t.includes('e')){
        var p=t.split('.'),ip=p[0],dp=p.length>1?'.'+p[1]:'',sg='';
        if(ip.startsWith('-')){sg='-';ip=ip.slice(1)}
        if(/^\d+$/.test(ip)){ip=ip.replace(/\B(?=(\d{3})+(?!\d))/g,',')}
        t=sg+ip+dp;
    }
    _disp.textContent=t;
    _disp.classList.remove('small','tiny');
    if(_disp.textContent.length>14)_disp.classList.add('small');
    if(_disp.textContent.length>20)_disp.classList.add('tiny');
    if(_s2&&_s1!==null){
        var opSym={add:'+',subtract:'−',multiply:'×',divide:'÷'}[_s2]||_s2;
        _hist.textContent=_fmt(_s1)+' '+opSym+' ';
    }else{
        _hist.innerHTML='&nbsp;';
    }
    _mem.classList.toggle('active',_s4!==0);
    _ang.textContent=_s5;
}

function _clr(){_s0='0';_s1=null;_s2=null;_s3=false;_upd()}

function _digit(d){
    if(_s3){_s0=d;_s3=false}
    else{
        if(_s0==='0'&&d!=='.'){_s0=d}
        else{
            if(_s0.replace('-','').replace('.','').length>=16)return;
            _s0+=d;
        }
    }
    _upd();
}

function _dot(){
    if(_s3){_s0='0.';_s3=false}
    else if(!_s0.includes('.')){_s0+='.'}
    _upd();
}

function _bs(){
    if(_s3)return;
    if(_s0.length===1||(_s0.length===2&&_s0.startsWith('-'))){_s0='0'}
    else{_s0=_s0.slice(0,-1)}
    _upd();
}

function _neg(){
    if(_s0==='0')return;
    _s0=_s0.startsWith('-')?_s0.slice(1):'-'+_s0;
    _upd();
}

function _pct(){
    var v=parseFloat(_s0);
    if(isNaN(v))return;
    if(_s2&&_s1!==null){_s0=String(_s1*v/100)}
    else{_s0=String(v/100)}
    _upd();
}

function _calc(a,b,op){
    switch(op){
        case 'add':return a+b;
        case 'subtract':return a-b;
        case 'multiply':return a*b;
        case 'divide':return b===0?NaN:a/b;
        default:return b;
    }
}

function _oper(nop){
    var iv=parseFloat(_s0);
    if(_s2&&_s3){_s2=nop;_upd();return}
    if(_s1===null){_s1=iv}
    else if(_s2){
        var r=_calc(_s1,iv,_s2);
        _s1=r;
        _s0=_fmt(r);
    }
    _s3=true;
    _s2=nop;
    _upd();
}

function _eq(){
    if(!_s2||_s1===null)return;
    var iv=parseFloat(_s0);
    var r=_calc(_s1,iv,_s2);
    _s0=_fmt(r);
    _s1=null;
    _s2=null;
    _s3=true;
    _hist.innerHTML='&nbsp;';
    _upd();
}

function _sci(fn){
    var x=parseFloat(_s0);
    if(isNaN(x)&&fn!=='rand'&&fn!=='pi'&&fn!=='e')return;
    var r;
    switch(fn){
        case 'sin':r=Math.sin(_s5==='DEG'?_toRad(x):x);break;
        case 'cos':r=Math.cos(_s5==='DEG'?_toRad(x):x);break;
        case 'tan':r=Math.tan(_s5==='DEG'?_toRad(x):x);break;
        case 'asin':if(x<-1||x>1){r=NaN;break}r=_fromRad(Math.asin(x));break;
        case 'acos':if(x<-1||x>1){r=NaN;break}r=_fromRad(Math.acos(x));break;
        case 'atan':r=_fromRad(Math.atan(x));break;
        case 'log':if(x<=0){r=NaN;break}r=Math.log10(x);break;
        case 'ln':if(x<=0){r=NaN;break}r=Math.log(x);break;
        case 'sqrt':if(x<0){r=NaN;break}r=Math.sqrt(x);break;
        case 'power':r=x*x;break;
        case 'reciprocal':if(x===0){r=NaN;break}r=1/x;break;
        case 'fact':
            if(x<0||!Number.isInteger(x)){r=NaN;break}
            if(x>170){r=Infinity;break}
            r=1;for(var i=2;i<=x;i++)r*=i;break;
        case 'pi':r=Math.PI;break;
        case 'e':r=Math.E;break;
        case 'abs':r=Math.abs(x);break;
        case 'exp10':r=Math.pow(10,x);break;
        case 'exp':r=Math.exp(x);break;
        case 'round':r=Math.round(x);break;
        case 'floor':r=Math.floor(x);break;
        case 'ceil':r=Math.ceil(x);break;
        case 'rand':r=Math.random();break;
        case 'pow':_s1=x;_s2='pow';_s3=true;_hist.textContent=_fmt(x)+' ^ ';return;
        case 'root':_s1=x;_s2='root';_s3=true;_hist.textContent=_fmt(x)+' ʸ√ ';return;
        default:return;
    }
    if(!isFinite(r)&&r!==Infinity&&r!==-Infinity){_s0='خطا'}
    else if(r===Infinity||r===-Infinity){_s0='خطا'}
    else{_s0=_fmt(r)}
    _s3=true;
    _upd();
}

function _mc(){_s4=0;_upd()}
function _mr(){_s0=_fmt(_s4);_s3=false;_upd()}
function _mplus(){_s4+=parseFloat(_s0)||0;_s3=true;_upd()}
function _mminus(){_s4-=parseFloat(_s0)||0;_s3=true;_upd()}
function _ms(){_s4=parseFloat(_s0)||0;_s3=true;_upd()}

function _click(e){
    var btn=e.target.closest('button');
    if(!btn)return;
    if(btn.dataset.num!==undefined){
        if(btn.dataset.num==='.')_dot();else _digit(btn.dataset.num);
        return;
    }
    var a=btn.dataset.action;
    if(a){
        switch(a){
            case 'clear':_clr();break;
            case 'backspace':_bs();break;
            case 'negate':_neg();break;
            case 'percent':_pct();break;
            case 'add':case 'subtract':case 'multiply':case 'divide':_oper(a);break;
            case 'equals':_eq();break;
            case 'sqrt':_sci('sqrt');break;
            case 'power':_sci('power');break;
            case 'reciprocal':_sci('reciprocal');break;
            case 'exp':_sci('exp');break;
            case 'mc':_mc();break;
            case 'mr':_mr();break;
            case 'mplus':_mplus();break;
            case 'mminus':_mminus();break;
            case 'ms':_ms();break;
        }
        return;
    }
    var s=btn.dataset.sci;
    if(s){
        if(s==='angle'){
            _s5=_s5==='DEG'?'RAD':'DEG';
            btn.textContent=_s5;
            _upd();
        }else{
            _sci(s);
        }
        return;
    }
}

_tabs.forEach(function(b){
    b.addEventListener('click',function(){
        _tabs.forEach(function(x){x.classList.remove('active')});
        _panels.forEach(function(p){p.classList.remove('active')});
        b.classList.add('active');
        _e('panel-'+b.dataset.tab).classList.add('active');
    });
});

document.querySelector('.calculator').addEventListener('click',_click);

document.addEventListener('keydown',function(e){
    var k=e.key;
    if(/^[0-9]$/.test(k)){_digit(k);e.preventDefault();return}
    switch(k){
        case '.':case ',':_dot();e.preventDefault();break;
        case '+':_oper('add');e.preventDefault();break;
        case '-':_oper('subtract');e.preventDefault();break;
        case '*':case '×':_oper('multiply');e.preventDefault();break;
        case '/':case '÷':_oper('divide');e.preventDefault();break;
        case 'Enter':case '=':_eq();e.preventDefault();break;
        case 'Backspace':_bs();e.preventDefault();break;
        case 'Escape':case 'c':case 'C':_clr();e.preventDefault();break;
        case '%':_pct();e.preventDefault();break;
        case 'p':_sci('pi');e.preventDefault();break;
        case 'e':_sci('e');e.preventDefault();break;
        case 'r':_sci('sqrt');e.preventDefault();break;
        case 's':_sci('sin');e.preventDefault();break;
        case 'o':_sci('cos');e.preventDefault();break;
        case 't':_sci('tan');e.preventDefault();break;
        case 'l':_sci('log');e.preventDefault();break;
        case 'n':_sci('ln');e.preventDefault();break;
    }
});

_upd();

document.querySelectorAll('button').forEach(function(b){
    b.addEventListener('touchstart',function(){},{passive:true});
});

})();
</script>

</body>
</html>
